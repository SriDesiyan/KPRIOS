version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: kpyrios_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kpyrios_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kpyrios_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-kpyrios_acpia}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kpyrios_user} -d ${POSTGRES_DB:-kpyrios_acpia}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: kpyrios_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kpyrios_user}:${POSTGRES_PASSWORD:-kpyrios_secure_password_2026}@db:5432/${POSTGRES_DB:-kpyrios_acpia}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-kpyrios_jwt_secret_dev_key_2026_super_secure_forensic}
      ENVIRONMENT: development
      STORAGE_DIR: /app/data/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - evidence_storage:/app/data/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: kpyrios_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  evidence_storage:
